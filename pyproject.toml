[project]
name = "kedra-wrc-pipeline"
version = "0.1.0"
description = "Scrapy ingestion pipeline for Workplace Relations Commission decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "dagster>=1.11,<2",
    "minio>=7.2,<8",
    "pymongo>=4.10,<5",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "scrapy>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
wrc-transform = "wrc_pipeline.transformation.transform:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
